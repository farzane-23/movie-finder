<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMDb - Discover Movies</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <header class="header">
        <div class="container header-content">

            <a href="index.html" class="logo">IMDb</a>

            <div class="header-search">
                <div class="search-box">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search movies..."
                        autocomplete="off"
                    >
                    <button id="searchButton" type="button">
                        Search
                    </button>
                </div>

                <div id="suggestions" class="suggestions"></div>
            </div>

            <nav class="navbar">
                <a href="index.html" class="active">Home</a>

                <select id="genreSelect">
                    <option value="">Genres</option>
                </select>
            </nav>

        </div>
    </header>

    <main>

        
        <section class="hero">
            <div class="hero-overlay">
                <div class="container hero-content">
                    <span class="hero-label">WELCOME TO IMDb</span>

                    <h1>Discover Your Next Favorite Movie</h1>

                    <p>
                        Explore popular movies, discover new stories
                        and find the perfect movie for your next watch.
                    </p>

                    <a href="#popularMovies" class="hero-button">
                        Explore Movies
                    </a>
                </div>
            </div>
        </section>

       
        <section class="movies-section container" id="popularMovies">

            <div class="section-heading">
                <div>
                    <span class="section-subtitle">EXPLORE</span>
                    <h2 id="sectionTitle">Popular Movies</h2>
                </div>
            </div>

            <p id="loading" class="message hidden">
                Loading movies...
            </p>

            <p id="error" class="message hidden"></p>

            <p id="emptyState" class="message hidden">
                No movies found!
            </p>

            <div id="movieList" class="movie-grid"></div>

            <div id="pagination" class="pagination"></div>

        </section>

    </main>

   
    <footer class="footer">
        <div class="container">
            <a href="index.html" class="footer-logo">IMDb</a>
            <p>Discover movies. Explore stories.</p>
            <p class="copyright">
                © 2026 Movie Finder
            </p>
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="script.js"></script>

</body>
</html>
